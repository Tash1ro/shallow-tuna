networks:
  exit1:
    ipam:
      config:
        - subnet: 172.100.0.0/24

services:
  # wg-easy v15 in AmneziaWG mode. Settings (host, WG port, DNS, allowed IPs,
  # admin account, AWG obfuscation params) live in a database under
  # /etc/wireguard and are configured through the web UI on first run.
  awg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: awg-easy
    restart: unless-stopped
    entrypoint: ["sh", "/routing-init.sh"]
    command: ["/usr/bin/dumb-init", "node", "server/index.mjs"]
    environment:
      # Admin panel is plain HTTP behind an SSH tunnel
      - INSECURE=true
      # Force AmneziaWG: awg-quick uses the amneziawg kernel module when the
      # host has it and falls back to the bundled userspace amneziawg-go
      # otherwise. Set OVERRIDE_AUTO_AWG=wg to run plain WireGuard.
      - EXPERIMENTAL_AWG=true
      - OVERRIDE_AUTO_AWG=awg
      # No IPv6 exit (host-routing SNATs IPv4 only): drop the IPv6 address
      # from the interface and client configs. Keep ::/0 in the UI's Allowed
      # IPs so client IPv6 is blackholed in the tunnel instead of leaking.
      - DISABLE_IPV6=${DISABLE_IPV6:-true}
      - EXIT_ROUTES=${EXIT_ROUTES:-}
    volumes:
      - ./workdir/awg:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      - ./services/wg-easy/routing-init.sh:/routing-init.sh:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    # The image's own healthcheck only probes `wg show`, which cannot see
    # AmneziaWG interfaces (separate netlink family / socket dir), so in awg
    # mode the container would stay "unhealthy" forever and host-routing's
    # service_healthy dependency would never be satisfied. Probe both tools.
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "(/usr/bin/wg show; /usr/bin/awg show) 2>/dev/null | /bin/grep -q interface",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
    ports:
      # Must match the WireGuard port configured in the web UI (default 51820)
      - "${AWG_PORT:-51820}:${AWG_PORT:-51820}/udp"
      # Bind admin panel to localhost only — access via SSH tunnel
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    networks:
      - exit1

  host-routing:
    build: ./services/host-routing
    container_name: host-routing
    network_mode: host
    # on-failure so a clean exit 0 (e.g. empty EXIT_ROUTES — nothing to
    # manage) stops the container instead of restart-looping
    restart: on-failure
    # compose.wg.yml adds a wg-easy dependency when that overlay is loaded
    depends_on:
      awg-easy:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    environment:
      - EXIT_ROUTES=${EXIT_ROUTES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/host-routing/manage.sh:/app/manage.sh:ro
      - ./services/host-routing/daemon.sh:/app/daemon.sh:ro
    entrypoint: ["sh", "/app/daemon.sh"]

  # Drops nDPI-classified traffic (default: BitTorrent) on the host's
  # DOCKER-USER chain. Bundles libxt_ndpi.so; needs the xt_ndpi kernel module
  # on the host (xt-ndpi-dkms). Build the .debs first: ./setup-host/ndpi-setup.sh build
  xt-ndpi-rules:
    build:
      context: .
      dockerfile: services/xt-ndpi-rules/Dockerfile
    container_name: xt-ndpi-rules
    # host netns so its iptables writes into the host's tables (where dockerd
    # creates DOCKER-USER); NET_ADMIN to edit them, SYS_MODULE to load xt_ndpi.
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - NDPI_CHAIN=${NDPI_CHAIN:-DOCKER-USER}
      - NDPI_DROP=${NDPI_DROP:-bittorrent}
      # Enforce ONLY on the VPN exit subnets (the source on DOCKER-USER after
      # the container's MASQUERADE), so it never touches non-VPN traffic. Each
      # entry is one exit — drop an entry to leave that exit unblocked, or set
      # NDPI_SOURCE= (explicitly empty) to enforce on ALL forwarded traffic.
      # ('-' not ':-' so an empty value means unscoped, unset means the default)
      #   exit1 = 172.100.0.0/24  (compose.exit2.yml adds exit2 = 172.101.0.0/24)
      - NDPI_SOURCE=${NDPI_SOURCE-172.100.0.0/24}
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./services/xt-ndpi-rules/manage.sh:/app/manage.sh:ro
      - ./services/xt-ndpi-rules/daemon.sh:/app/daemon.sh:ro

  # One-shot backup of ./workdir/{awg,wg} into ./workdir/backups. The backups dir and
  # archive are chowned to BACKUP_USER_ID:BACKUP_GROUP_ID (numeric IDs — the
  # container has no host users).
  # Profiled, so `docker compose up` never starts it; run on demand:
  #   docker compose run --rm backup                        # archive on server
  #   docker compose run --rm -T backup --stdout > f.tar.gz # stream only, no server copy
  # (or use ./remote/tuna-backup.sh from your machine)
  backup:
    profiles: ["backup"]
    image: alpine:3
    entrypoint: ["sh", "/backup.sh"]
    environment:
      - BACKUP_USER_ID=${BACKUP_USER_ID:-1000}
      - BACKUP_GROUP_ID=${BACKUP_GROUP_ID:-1000}
    volumes:
      - ./workdir:/data:ro
      - ./workdir/backups:/backups
      - ./services/backup/backup.sh:/backup.sh:ro

  # Throwaway probe used by ./services/xt-ndpi-rules/verify.sh. Lives on the real exit1
  # network, so traffic it sends out is forwarded through DOCKER-USER sourced
  # from the exit1 subnet — exactly like a VPN client. Profiled, so a normal
  # `docker compose up` never starts it; verify drives it with
  # `docker compose run`.
  ndpi-probe-exit1:
    profiles: ["verify"]
    image: python:3-slim
    networks:
      - exit1
    entrypoint: ["python3", "-c"]
